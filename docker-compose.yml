version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
    restart: always

  backend:
    build:
      context: ./backend
    volumes:
      - backend_data:/app/data
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "8765:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  backend_data:
